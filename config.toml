# kane 監視設定。
# データの取り込み元： "rss"（楽天 マーケットスピードII RSS / Excel） または "kabu"（kabuステーションAPI）
[source]
type = "rss"

# パスは既存の点火監視システムと同じファイルを流用（中身はリポジトリに入れない）
[kabu]
base_url = "http://localhost:18080/kabusapi"
ws_url = "ws://localhost:18080/kabusapi/websocket"
password_file = "C:/Users/takuy/Downloads/kabu_api_word.txt"

[slack]
enabled = false   # Slackには送らない（画面のアラート窓のみ）。送る場合は true
# webhook_file = "C:/Users/takuy/Downloads/slack_webhook.txt"   # Slackは使わない

[notify]
beep = false   # true にするとWindowsの通知音も鳴らす
feed = true     # 画面右上のアラート窓（最前面）に全通知を流す
popup_rules = ["R13", "R14:剥がれ", "R14:警戒", "R16", "R17:特買い", "R17:特売り", "R18:買い"]   # アラート窓で赤く強調＋音（ルール名 or ルール名:レベル）
quiet_after = "15:25"   # この時刻以降はアラート窓・音を出さない（記録は続ける）
quiet_except = ["R16", "R18"]   # 15:25以降でも出すルール（引けオークション・適時開示）
dialog = false  # true にすると popup_rules の通知でメッセージボックスも出す（フォーカスを奪うので注意）

[paths]
symbols_csv = "symbols.csv"
data_dir = "C:/Users/takuy/Desktop/08_開発案件/kane_data"

[session]
start = "08:55"
end = "15:35"

[record]
snapshots = true   # PUSH配信を全部CSVに残す（リプレイ検証用）

# 閾値（省略時は kane/config.py の既定値）
[rules]
turnover_levels = [0.4, 0.9]   # 50%・100%だと出遅れるので早めに
vwap_dev_levels = [0.05, 0.08, 0.10]
wall_min_yen = 50000000   # 大口板（R13）は金額5,000万円以上だけ見張る
wall_mult = 10.0          # かつ、周りの板（20本の中央値）の10倍以上
wall_warn_ratio = 0.5     # 大口板がピークの50%以下に減ったら「剥がれ予兆」（20%以下・突き抜けで「剥がれ」）
wall_notify_appear = true # 大口板が出た／見える範囲に入ったことも通知（赤・音）
wall_cooldown_sec = 300   # 同じ値段の板は5分に1回まで
ladder_levels = 3         # 連なり板：同じ量の板が3本以上、値段が連続して並んだら通知（例：1,143〜1,138円に8,000株×4）
ladder_tol = 0.15         # 各段の量の差が15%以内なら同じ量とみなす
ladder_mult = 5.0         # 各段が周りの板の中央値の5倍以上
ladder_min_yen = 20000000 # 合計金額2,000万円以上
depth_jump_ratio = 0.3    # 板の総量（10本の合計）が1回の更新で30%以上 増えた／減ったら通知（例：買い板200万株に急に100万株）
depth_jump_min_yen = 20000000 # 増減分が2,000万円以上
depth_cooldown_sec = 120  # 同じ側は2分に1回まで
close_imbalance_ratio = 0.3   # R16：引けオークションの成行の売り買い差が、反対側の板10本合計の30%以上
close_imbalance_min_yen = 20000000 # かつ差額2,000万円以上
special_cooldown_sec = 20     # R17 特別気配：同じ向きが20秒以内に再び付いても通知しない（点滅よけ）
price_step = 0.05

# ランキングで全市場から動いている銘柄を拾い、PUSH 50枠の残りを自動で入れ替える
# （symbols.csv の銘柄は固定で常に登録）
[scanner]
enabled = true
interval_sec = 10
max_push = 50
min_hold_sec = 600
light_alerts = true
# [種類, 市場]  種類 1値上がり率 2値下がり率 3売買高 4売買代金 5TICK回数 6売買高急増 7売買代金急増
#               市場 ALL 全市場 / TP プライム / TS スタンダード / TG グロース
rankings = [[1, "ALL"], [6, "ALL"], [7, "ALL"], [5, "ALL"], [1, "TG"], [1, "TS"], [2, "ALL"]]

# ---- 楽天RSS（source.type = "rss" のとき） ----
[rss]
workbook = "C:/Users/takuy/Desktop/08_開発案件/kane_data/kane_rss.xlsx"   # kane が式を書き込むブック（無ければ作る）
poll_sec = 1.0        # スキャン銘柄の読み取り間隔（秒）
watch_poll_sec = 0.3  # 固定銘柄（板・成行・R13/R16）の読み取り間隔（秒）。別スレッドで回す
code_suffix = ".T"
board_levels = 10          # 固定銘柄の板の本数（重ければ 5 や 0 に）
universe_csv = "universe.csv"   # スキャン用の銘柄一覧（python -m kane.universe で作る）
max_scan = 420    # 楽天RSSは1口座で合計500銘柄まで（超えた分は「表示銘柄数超過」で値が来ない）。universe から平均売買代金の大きい順に選ぶ
rss_symbol_limit = 500
rss_reserve = 40  # 「回転率いま」（floats）など同時に使う分の予備
scan_rules = ["R2", "R3", "R4", "R10", "R14", "R15", "R17"]   # スキャン銘柄で通知するルール（R15は全銘柄で1日80〜160件）
scan_min_value_yen = 100000000              # スキャン銘柄は売買代金1億円以上だけ通知
value_unit = 1000          # 楽天RSSの売買代金は千円単位

# RssMarket の項目名。check.bat でエラーが出た項目は、公式の関数一覧の表記に書き換える
[rss.items]
price = "現在値"
volume = "出来高"
vwap = "VWAP"
value = "売買代金"   # VWAP が空なら 売買代金÷出来高 で計算
open = "始値"
high = "高値"
low = "安値"
prev_close = "前日終値"
ytd_high = "年初来高値"
bid_price = "最良買気配値{i}"
bid_qty = "最良買気配数量{i}"
ask_price = "最良売気配値{i}"
ask_qty = "最良売気配数量{i}"
mkt_buy = "成行買数量"   # 引けオークションの成行（R16）。check.bat でエラーなら公式の項目名に直す
mkt_sell = "成行売数量"
cap = "時価総額"   # 百万円単位。R18（提携の小型判定）と大手リストの自動作成に使う
bid_sign = "特別買気配フラグ"   # 特別買気配のとき "S"（R17 特買い）。check.bat でエラーなら公式の項目名に直す
ask_sign = "特別売気配フラグ"   # 特別売気配のとき "S"（R17 特売り）

[tdnet]
# 適時開示（TDnet）を1秒おきに見て、R18 を出す。python -m kane.tdnet --check で動作確認
enabled = true
poll_sec = 1.0
start = "08:00"
end = "18:30"
newest_first = true     # 一覧の先頭が最新なら true（--check の「先頭／末尾」で確認）
buyback_min_pct = 5.0   # 自己株式取得：発行済株式総数の5%以上で買い
small_max_oku = 300     # 提携：開示した会社の時価総額300億円以下なら小型（買う側）
big_min_oku = 10000     # 提携：相手が時価総額1兆円以上なら大手
yutai_min_yield_pct = 4.0  # 株主優待の新設・拡充：優待利回り（100株）4%以上で買い
followup_sec = 4.0      # 自己株の割合が本文に無いとき、4秒以内に推定して追記する
bigcaps_file = "bigcaps.txt"
