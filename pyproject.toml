[project]
name = "kane"
version = "0.1.0"
description = "Realtime English<->Japanese voice translator powered by OpenAI Realtime 2"
authors = [{ name = "Takuya Kanesaki" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.1",
    "ruff>=0.5",
]

[project.scripts]
kane = "kane.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kane*"]

[tool.setuptools.package-data]
kane = ["static/*"]
