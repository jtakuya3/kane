[tool.poetry]
name = "kane"
version = "0.1.0"
description = "デイトレ用リアルタイム検出（kabuステーションAPI → ルール判定 → Slack通知・CSV保存）"
authors = ["Takuya Kanesaki"]

[tool.poetry.dependencies]
python = ">=3.11"
websockets = ">=12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.1"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
