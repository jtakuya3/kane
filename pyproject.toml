[tool.poetry]
name = "kane"
version = "0.1.0"
description = "Daily highlight clipper for Elon Musk and Anthropic CEO media appearances, with JA subs + X auto-post."
authors = ["Takuya Kanesaki"]

[tool.poetry.dependencies]
python = "^3.12"
yt-dlp = "^2025.1.15"
anthropic = "^0.40.0"
faster-whisper = "^1.0.3"
tweepy = "^4.14.0"
requests = "^2.32.3"
pydantic = "^2.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.1"
flake8 = "^7.0.0"

[tool.poetry.scripts]
kane = "kane.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
