[tool.poetry]
name = "kane"
version = "0.1.0"
description = "Your personal AI assistant. Inspired by OpenClaw."
authors = ["Takuya Kanesaki"]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.1.1"
flake8 = "^7.0.0"

[tool.poetry.scripts]
kane = "kane.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
