name: Daily Investment Cycle

on:
  schedule:
    # 毎日朝7時JST（UTC 22:00前日）に実行
    - cron: '0 22 * * 0-4'  # 月〜金の市場営業日のみ
  workflow_dispatch:  # 手動実行ボタン

jobs:
  invest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      # ポートフォリオDBを前回の実行から復元
      - name: Restore portfolio DB
        uses: actions/cache@v4
        with:
          path: data/portfolio.db
          key: portfolio-db-${{ github.run_number }}
          restore-keys: |
            portfolio-db-

      - name: Run daily cycle
        run: python -m five_agents.main --live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WHALE_ALERT_API_KEY: ${{ secrets.WHALE_ALERT_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}

      # ポートフォリオDBをartifactとしても保存（バックアップ）
      - name: Save portfolio DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-db-${{ github.run_number }}
          path: data/portfolio.db
          retention-days: 90
