name: daily-clip-and-post

on:
  schedule:
    # 07:00 JST = 22:00 UTC (previous day)
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-root

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: kane-state-${{ github.run_id }}
          restore-keys: |
            kane-state-

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          KANE_WHISPER_MODEL: small.en
        run: poetry run kane -v

      - name: Upload clips + state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kane-output-${{ github.run_id }}
          path: |
            data/clips/
            data/state.json
          if-no-files-found: ignore
