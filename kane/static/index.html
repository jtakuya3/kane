<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Kane — Realtime EN ⇄ JA</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Kane</div>
      <div id="status" class="status status--idle" aria-live="polite">待機中</div>
      <button id="settings-btn" class="icon-btn" aria-label="設定">⚙️</button>
    </header>

    <main class="transcript" id="transcript" aria-live="polite">
      <div class="column__list" id="column-out"></div>
    </main>

    <footer class="dock">
      <button id="mute-btn" class="icon-btn" aria-label="ミュート" disabled>🎤</button>
      <button id="talk-btn" class="talk-btn" aria-label="開始">
        <span class="talk-btn__core"></span>
        <span class="talk-btn__label">START</span>
      </button>
      <button id="end-btn" class="icon-btn" aria-label="終了" disabled>⏹</button>
    </footer>

    <dialog id="settings" class="settings">
      <form method="dialog" class="settings__form">
        <h2>設定</h2>

        <label class="field">
          <span>音声</span>
          <select id="voice-select">
            <option value="marin">marin (女性 / 自然)</option>
            <option value="cedar">cedar (男性 / 落ち着き)</option>
            <option value="alloy">alloy</option>
            <option value="ash">ash</option>
            <option value="ballad">ballad</option>
            <option value="coral">coral</option>
            <option value="echo">echo</option>
            <option value="sage">sage</option>
            <option value="shimmer">shimmer</option>
            <option value="verse">verse</option>
          </select>
        </label>

        <label class="field field--check">
          <input id="captions-toggle" type="checkbox" checked />
          <span>字幕を表示</span>
        </label>

        <label class="field field--check">
          <input id="text-only-toggle" type="checkbox" checked />
          <span>字幕のみ（音声OFF・低コスト）</span>
        </label>

        <p class="muted small">
          このベータ版は OpenAI Realtime 2 (<code id="model-name">gpt-realtime-2</code>) を WebRTC
          で利用します。マイクの許可と HTTPS 接続が必要です。
        </p>

        <menu>
          <button value="close" class="ghost">閉じる</button>
        </menu>
      </form>
    </dialog>

    <audio id="remote-audio" autoplay playsinline></audio>

    <dialog id="login" class="settings login">
      <form id="login-form" class="settings__form">
        <h2>パスワード</h2>
        <p class="muted small">この Kane インスタンスはアクセス制限されています。</p>
        <label class="field">
          <span>合言葉</span>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="muted small" style="color: var(--danger); display: none;">
          パスワードが違います。
        </p>
        <menu>
          <button type="submit" class="primary">入室</button>
        </menu>
      </form>
    </dialog>

    <script src="./app.js" type="module"></script>
  </body>
</html>
